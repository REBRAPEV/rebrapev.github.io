name: Materialize hero image

on:
  push:
    branches: [main]
    paths:
      - ".image-parts/**"
      - ".github/workflows/materialize-hero-image.yml"

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode group photo
        shell: bash
        run: |
          if [ ! -d .image-parts ]; then
            echo "Image parts already removed; nothing to do."
            exit 0
          fi
          mkdir -p assets/images
          cat .image-parts/hero2-photo-*.b64 | base64 --decode > assets/images/sao-carlos-school-of-glass-2026.webp
          rm -rf .image-parts
          file assets/images/sao-carlos-school-of-glass-2026.webp

      - name: Commit group photo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/images .image-parts
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Add São Carlos School of Glass group photo"
          git push
