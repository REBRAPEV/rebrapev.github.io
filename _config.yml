title: REBRAPEV
description: "Rede brasileira para pesquisa, formação e colaboração em ciência e tecnologia de vidros."
url: "https://rebrapev.github.io"
baseurl: ""
lang: pt-BR
timezone: America/Sao_Paulo

markdown: kramdown
permalink: pretty

# One page per event in _eventos/, published at /eventos/<file name>/.
# future: true keeps upcoming events published; by default Jekyll drops
# documents dated after the build date.
future: true
collections:
  eventos:
    output: true
    permalink: /eventos/:name/

defaults:
  - scope:
      path: ""
      type: eventos
    values:
      layout: evento

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - README.md
  - LICENSE
  - NOTICE.md
  - Gemfile
  - Gemfile.lock
  - vendor

sass:
  style: compressed
