<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="REBRAPEV — página inicial">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
        <g stroke="var(--brand)" stroke-width="2.3" stroke-linecap="round">
          <path d="M21.12 8.16L32.64 14.88M32.64 14.88L39.36 26.4M39.36 26.4L34.56 37.92M34.56 37.92L22.08 39.84M22.08 39.84L10.56 33.12M10.56 33.12L8.64 20.64M8.64 20.64L11.52 11.04M11.52 11.04L21.12 8.16"/>
          <path d="M20.16 20.64L28.8 27.36M20.16 20.64L21.12 8.16M20.16 20.64L8.64 20.64M28.8 27.36L34.56 37.92"/>
        </g>
        <g fill="var(--brand)">
          <circle cx="21.12" cy="8.16" r="3"/><circle cx="32.64" cy="14.88" r="3"/><circle cx="39.36" cy="26.4" r="3"/>
          <circle cx="34.56" cy="37.92" r="3"/><circle cx="22.08" cy="39.84" r="3"/><circle cx="10.56" cy="33.12" r="3"/>
          <circle cx="8.64" cy="20.64" r="3"/><circle cx="11.52" cy="11.04" r="3"/><circle cx="20.16" cy="20.64" r="3"/>
        </g>
        <circle cx="28.8" cy="27.36" r="4.2" fill="var(--accent)"/>
      </svg>
      <span class="brand-name">REBRAPEV</span>
    </a>

    <nav class="desktop-nav" aria-label="Navegação principal">
      {% for item in site.data.navigation.main %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema" title="Alternar tema">◐</button>
    </nav>

    <details class="mobile-nav">
      <summary aria-label="Abrir menu">Menu</summary>
      <nav aria-label="Navegação móvel">
        {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
        <button class="theme-toggle" type="button" data-theme-toggle>Alternar tema</button>
      </nav>
    </details>
  </div>
</header>
