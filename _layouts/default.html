<!doctype html>
<html lang="{{ site.lang | default: 'pt-BR' }}" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#145f6b">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/assets/images/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    {% include header.html %}
    <main id="conteudo">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </body>
</html>
